<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Home Screen app: "default" lets the status bar take theme-color, so it is the
         ground of the chosen theme, light or dark (DESIGN.md section 4). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (() => {
        let choice;
        let custom = null;
        try {
          choice = window.localStorage.getItem("cubehaus.theme");
          if (choice === "custom")
            custom = JSON.parse(
              window.localStorage.getItem("cubehaus.theme.custom"),
            );
        } catch {}
        const hex = /^#[0-9a-f]{6}$/;
        const names = "ground ink dim gutter line prime double wide warn error pb";
        const base =
          custom && (custom.base === "dark" || custom.base === "light")
            ? custom.base
            : null;
        const dark = base
          ? base === "dark"
          : choice === "dark" ||
            (choice !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
        const root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        let ground = dark ? "#000000" : "#ffffff";
        const tokens = base && custom.tokens ? custom.tokens : {};
        const valid = names
          .split(" ")
          .every((name) => !(name in tokens) || hex.test(tokens[name]));
        if (valid)
          for (const name of names.split(" "))
            if (name in tokens) root.style.setProperty(`--${name}`, tokens[name]);
        if (valid && tokens.ground) ground = tokens.ground;
        document.querySelector('meta[name="theme-color"]').content = ground;
      })();
    </script>
    <link rel="preload" href="/fonts/roboto-solid.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Only the time's face is preloaded (it is drawn only once it has loaded). The words'
         face swaps in over a fallback of the same metrics, so it does not take bandwidth
         from the app's script on a slow connection. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>cubehaus</title>
    <!-- The link's preview in a chat (Telegram, WhatsApp) and in search. A preview needs
         the image's full address. -->
    <meta name="description" content="A speedcubing timer for the browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cubehaus" />
    <meta property="og:title" content="cubehaus" />
    <meta property="og:description" content="A speedcubing timer for the browser." />
    <meta property="og:url" content="https://cubehaus.imslide.workers.dev/" />
    <meta property="og:image" content="https://cubehaus.imslide.workers.dev/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The cubehaus house: a 3×3 cube under a roof" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
